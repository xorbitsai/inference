# Filebeat -> Elasticsearch example configuration
# Purpose: Collect xinference supervisor/worker application logs + audit logs, write directly to ES
# Usage: filebeat -e -c filebeat-json-to-es.yml
#
# Log format: JSON (one JSON object per line)
# Fields: @timestamp, level, module, process, role, address, node, message, exception

filebeat.inputs:
  # --- Application logs (supervisor) ---
  - type: log
    id: xinference-supervisor
    enabled: true
    paths:
      - /data/xinference_home/logs/xinference.log
      - /data/xinference_home/logs/xinference-*.log
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    fields:
      log_type: supervisor
      cluster: xinference
    fields_under_root: true

  # --- Application logs (worker) ---
  - type: log
    id: xinference-worker
    enabled: true
    paths:
      - /data/xinference_home_worker/logs/xinference.log
      - /data/xinference_home_worker/logs/xinference-*.log
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    fields:
      log_type: worker
      cluster: xinference
    fields_under_root: true

  # --- Audit logs (supervisor only) ---
  - type: log
    id: xinference-audit
    enabled: true
    paths:
      - /data/xinference_home/logs/audit.log
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    fields:
      log_type: audit
      cluster: xinference
    fields_under_root: true

  # --- Token Router Agent logs (JSON) ---
  - type: log
    id: xinference-token-router-agent
    enabled: true
    paths:
      - /data/inference/logs/router-agent/router.log*
    exclude_files: ['\.gz$']
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    fields:
      log_type: router_agent
      cluster: xinference
    fields_under_root: true

  # --- Token Router Runtime logs (JSON, one directory per assignment) ---
  - type: log
    id: xinference-token-router-runtime
    enabled: true
    paths:
      - /data/inference/logs/router-runtime/*/router.log*
    exclude_files: ['\.gz$']
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    fields:
      log_type: router_runtime
      cluster: xinference
    fields_under_root: true

  # --- Model request logs (NDJSON, sensitive body retained in _source only) ---
  - type: filestream
    id: xinference-model-request
    enabled: true
    paths:
      - ${XINFERENCE_MODEL_REQUEST_LOG_PATH:/data/xinference_home/logs/model_request.log*}
    exclude_files: ['\.gz$', '\.rotate\.lock$']
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
    message_max_bytes: 33554432
    fields:
      log_type: model_request
      cluster: xinference
    fields_under_root: true

processors:
  # Normalize model_request.log before the global event metadata is dropped.
  - rename:
      fields:
        - from: "event"
          to: "event_type"
      ignore_missing: true
      fail_on_error: false
      when:
        and:
          - equals:
              log_type: "model_request"
          - not:
              has_fields: ["event_type"]

  - timestamp:
      field: "timestamp"
      target_field: "@timestamp"
      layouts:
        - '2006-01-02T15:04:05.999Z07:00'
      ignore_missing: true
      ignore_failure: true
      when:
        equals:
          log_type: "model_request"

  - drop_fields:
      fields:
        - agent
        - ecs
        - host
        - input
        - log
        - event
        - data_stream
        - elastic_agent
        - cloud
        - container
        - kubernetes
        - orchestrator
        - "@version"
      ignore_missing: true

  - timestamp:
      field: "@timestamp"
      layouts:
        - '2006-01-02T15:04:05.000Z'
      timezone: "UTC"
      ignore_failure: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  indices:
    - index: "xinference-audit-%{+yyyy.MM.dd}"
      when:
        equals:
          log_type: "audit"
    - index: "xinference-model-request-%{+yyyy.MM.dd}"
      when:
        equals:
          log_type: "model_request"
    - index: "xinference-logs-%{[log_type]}-%{+yyyy.MM.dd}"
      when:
        has_fields: ["log_type"]
  # username: "elastic"
  # password: "changeme"

setup.template.name: "xinference"
setup.template.pattern: "xinference-*"
setup.template.settings:
  index.number_of_shards: 2
  index.number_of_replicas: 1

setup.ilm.enabled: false
setup.ilm.rollover_alias: "xinference-logs"
setup.ilm.policy_name: "xinference-logs-policy"

logging.metrics.enabled: true
logging.metrics.period: 60s
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
