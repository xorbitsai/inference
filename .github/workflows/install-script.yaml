name: Install Script CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install*'
      - 'pyproject.toml'
      - 'scripts/check_install.py'
      - 'scripts/manage_install.py'
      - 'xinference/deploy/service.py'
      - 'xinference/deploy/cmdline.py'
      - 'xinference/deploy/test/test_service.py'
      - 'xinference/deploy/test/test_installer.py'
      - '.github/workflows/install-script.yaml'
  pull_request:
    types: ['opened', 'reopened', 'synchronize']
    paths:
      - 'scripts/install*'
      - 'pyproject.toml'
      - 'scripts/check_install.py'
      - 'scripts/manage_install.py'
      - 'xinference/deploy/service.py'
      - 'xinference/deploy/cmdline.py'
      - 'xinference/deploy/test/test_service.py'
      - 'xinference/deploy/test/test_installer.py'
      - '.github/workflows/install-script.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/install.sh

  install:
    name: install and service (${{ matrix.os }}, cpu)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      NO_WEB_UI: '1'
      XINFERENCE_BACKEND: cpu
      XINFERENCE_START: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure isolated tool paths
        shell: bash
        run: |
          echo "UV_TOOL_DIR=$RUNNER_TEMP/xinference-tools" >> "$GITHUB_ENV"
          echo "UV_TOOL_BIN_DIR=$RUNNER_TEMP/xinference-bin" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
      - name: Build the candidate wheel
        shell: bash
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
          wheel=$(find "$RUNNER_TEMP/wheels" -name 'xinference-*.whl' -print -quit)
          echo "XINFERENCE_PACKAGE=$wheel" >> "$GITHUB_ENV"
      - name: Run POSIX installer
        if: runner.os != 'Windows'
        run: sh scripts/install.sh
      - name: Run Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1
      - name: Test service behavior and native lifecycle (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python="$UV_TOOL_DIR/xinference/bin/python"
          "$python" -m xinference.deploy.cmdline service --help
          uv pip install --python "$python" pytest pytest-asyncio pytest-timeout
          "$python" -m pytest -q xinference/deploy/test/test_service.py xinference/deploy/test/test_installer.py
          cd "$RUNNER_TEMP"
          uv run --no-project --no-config --python 3.12 --with psutil python "$GITHUB_WORKSPACE/scripts/check_install.py"
      - name: Test service behavior and native lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = Join-Path $env:UV_TOOL_DIR 'xinference\Scripts\python.exe'
          & $python -m xinference.deploy.cmdline service --help
          if ($LASTEXITCODE -ne 0) { throw 'Missing service CLI' }
          uv pip install --python $python pytest pytest-asyncio pytest-timeout
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
          & $python -m pytest -q xinference/deploy/test/test_service.py xinference/deploy/test/test_installer.py
          if ($LASTEXITCODE -ne 0) { throw 'Service tests failed' }
          Set-Location $env:RUNNER_TEMP
          uv run --no-project --no-config --python 3.12 --with psutil python "$env:GITHUB_WORKSPACE/scripts/check_install.py"
          if ($LASTEXITCODE -ne 0) { throw 'Native service lifecycle failed' }
